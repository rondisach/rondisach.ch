# Baut Vorschau-Zweige (vorschau-*), ohne sie zu veröffentlichen. Das Ergebnis landet im Zweig vorschau-dist.
name: Vorschau

on:
  push:
    branches: ['vorschau-*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Ergebnis in Zweig vorschau-dist ablegen (wird nicht veröffentlicht)
        run: |
          cd dist
          git init -q -b vorschau-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Vorschau von ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" vorschau-dist
